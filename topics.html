<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topics Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: calm and quick for someone whose chats have piled up; nothing to learn before it helps.
   IDEA: a home for your work that files itself, with Timeback Machine™ bringing you suggestions to approve.
   PICTURE: the home screen: topic hubs, the suggestions inbox, and the time Timeback Machine™ has found.
   COLOUR and TYPE: ink sidebar, white canvas, cobalt for actions, green for active work and time saved; Inter Tight over Inter.
   LAYOUT: sidebar with views and topics, then command bar, stats, inbox, hubs and cards. Stacks on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c0d10);--surf:light-dark(#f4f5f7,#14161b);--card:light-dark(#ffffff,#191c22);
--ink:light-dark(#0f1115,#eef0f3);--muted:light-dark(#5b6270,#9aa1ad);--line:light-dark(#e5e7eb,#272b33);
--side:light-dark(#f1f4ff,#121a33);--sideink:light-dark(#1b2552,#e6ebff);--sidemut:light-dark(#5c6894,#9aa7d6);--sidehov:light-dark(#e3e9ff,#1c2647);--sidecur:light-dark(#d6e0ff,#26346a);--sideline:light-dark(#d9e1ff,#24305c);
--acc:light-dark(#2b59ff,#7a95ff);--accsoft:light-dark(#eef2ff,#1b2240);
--ok:light-dark(#0f9d58,#3ccf84);--oksoft:light-dark(#e9f7ef,#13261b);--stale:light-dark(#9aa3b2,#5d6573)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--sideline);color:var(--sideink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:20px}
.brand{padding:0 8px}.brand b{display:block;font:800 22px/1.1 "Inter Tight",sans-serif}.brand span{font-size:12.5px;color:var(--sidemut)}
.nav{display:grid;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--sideink);border-radius:9px;padding:9px 10px;min-height:40px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--sidehov)}.nav button[aria-current=true]{background:var(--sidecur);color:var(--acc);font-weight:600}
.nav button.over{outline:2px solid var(--acc)}
.nav small{color:var(--sidemut);font-variant-numeric:tabular-nums}.nav .hot small{background:var(--acc);color:#fff;border-radius:999px;padding:0 7px}
.sideh{font-size:11.5px;font-weight:600;color:var(--sidemut);padding:0 10px;margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px}
.pill{border:1px solid var(--sideline);background:transparent;color:var(--sideink);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.pill[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-act{background:var(--ok)}.d-ref{background:var(--acc)}.d-stale{background:var(--stale)}.d-arch{border:1.5px dashed var(--stale)}
main{padding:22px clamp(16px,3vw,36px) 120px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--muted)}
.cmd{display:flex;align-items:center;gap:10px;margin:18px 0 6px;background:var(--surf);border:1.5px solid transparent;border-radius:14px;padding:4px 6px 4px 14px}
.cmd:focus-within{border-color:var(--acc);background:var(--bg)}
.cmd svg{flex:none;color:var(--muted)}.cmd input{flex:1;border:0;background:transparent;padding:11px 0;font-size:16px;outline:0}
.kbd{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin:0 0 6px 4px}
.ask{display:none;margin:8px 0;padding:14px 16px;border-radius:14px;background:var(--accsoft);align-items:flex-start;gap:12px;justify-content:space-between}.ask.on{display:flex}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:14px;background:var(--accsoft);margin-top:14px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.stat{background:var(--surf);border-radius:12px;padding:10px 14px;min-width:130px}
.stat b{display:block;font:800 24px/1.1 "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--muted)}
.stat.g b{color:var(--ok)}
section.grp{margin-top:32px}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.gh h2{font-size:23px;font-weight:700;letter-spacing:-.01em}.gh p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
.gh .lnk{border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:4px}
.props{display:grid;gap:10px}
.prop{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;background:var(--card)}
.prop.fix{border-left:4px solid var(--ok)}.prop.topic{border-left:4px solid var(--acc)}.prop.pi{border-left:4px solid var(--muted)}
.prop .k{font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prop .tb{color:var(--ok)}
.prop h3{font-size:17px}.prop p{margin:0;font-size:14px;color:var(--muted)}
.prop .ev{display:flex;flex-wrap:wrap;gap:6px}.prop .ev a{font-size:12.5px;background:var(--surf);border-radius:6px;padding:2px 8px;text-decoration:none}
.prop .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prop pre{white-space:pre-wrap;background:var(--surf);border-radius:10px;padding:10px 12px;margin:0;font:13px/1.5 ui-monospace,Menlo,monospace;max-height:180px;overflow:auto}
.prop ol{margin:0;padding-left:20px;font-size:14px}
.btn{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 13px;min-height:38px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{min-height:32px;padding:4px 10px;font-size:12.5px}
.btn:focus-visible,.nav button:focus-visible,.pill:focus-visible,.card:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hub{border-radius:16px;padding:18px;background:var(--acc);color:#fff;display:flex;flex-direction:column;gap:6px;min-height:140px;text-decoration:none;transition:transform .15s}
.hub:hover{transform:translateY(-2px)}.hub small{opacity:.85;font-size:12.5px}.hub h3{font-size:21px}.hub p{margin:0;font-size:13.5px;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;display:grid;gap:5px;transition:box-shadow .15s,transform .15s,opacity .15s;align-content:start}
.card:hover{box-shadow:0 6px 18px -8px #0f111540;transform:translateY(-1px)}
.card.st-act{border-color:light-dark(#bfe3cc,#1f4a30)}.card.st-stale .ttl{color:var(--muted)}.card.st-arch{border-style:dashed;opacity:.8}
.card.sel{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}.card.focus{box-shadow:0 0 0 2.5px var(--ink)}
.meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stp{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.pk{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;opacity:0;transition:opacity .1s}
.card:hover .pk,.card.sel .pk,body.selecting .pk,.pk:focus-within{opacity:1}@media(hover:none){.pk{opacity:1}}
.pk input{width:18px;height:18px;accent-color:var(--acc);cursor:pointer;margin:0}
.ttl{font-weight:600;font-size:14.5px;line-height:1.3}
.desc{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{border:0;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;cursor:pointer;background:var(--accsoft);color:var(--acc)}
.tag.c{background:var(--surf);color:var(--ink)}
.flag{font-size:11.5px;font-weight:600;color:var(--acc)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1.5px dashed var(--line);border-radius:14px}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-20px 0 40px -20px #0f111540;transform:translateX(102%);transition:transform .2s;z-index:20;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.dh h2{font-size:20px}
.db{padding:18px 20px;overflow:auto;display:grid;gap:16px;align-content:start}
.db h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.db ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.db li button{border:0;background:var(--surf);border-radius:8px;padding:7px 10px;width:100%;text-align:left;cursor:pointer;font-size:13.5px}
.db select{border:1.5px solid var(--line);border-radius:10px;padding:8px;min-height:40px;background:var(--bg);width:100%}
.bulk{position:fixed;left:50%;bottom:22px;transform:translate(-50%,160%);background:light-dark(#1b2552,#26346a);color:#fff;border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 18px 40px -12px #0008;transition:transform .2s;z-index:25;max-width:calc(100vw - 24px)}
.bulk.on{transform:translate(-50%,0)}.bulk b{padding:0 6px}
.bulk .btn{background:transparent;color:#fff;border-color:#ffffff44}.bulk .btn.pri{background:var(--acc);border-color:var(--acc)}
.bulk select{border-radius:10px;padding:6px;min-height:36px;background:#ffffff14;color:#fff;border:1px solid #ffffff44}.bulk select option{color:#0f1115}
.status{font-size:12.5px;color:var(--muted)}
.desk{font-size:12.5px;font-weight:600;color:var(--acc);text-decoration:none;border:1.5px solid var(--acc);border-radius:999px;padding:3px 10px}.desk:hover{background:var(--accsoft)}
.chk.on{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px;font-size:13.5px;font-weight:600;color:var(--ok)}
.sw{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px 4px 6px;min-height:36px;cursor:pointer;font-size:13px;font-weight:600}
.sw .knob{width:34px;height:20px;border-radius:999px;background:var(--stale);position:relative;flex:none;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true] .knob{background:var(--ok)}.sw[aria-checked=true] .knob::after{transform:translateX(14px)}
.swnote{flex-basis:100%;margin:0;font-size:12.5px;font-weight:500;color:var(--muted)}
.chk.off{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;padding:16px 18px;border-radius:14px;background:light-dark(#fff4e0,#33260f);border:1.5px solid light-dark(#f0b44c,#8a6420)}
.chk.off b{display:block;font-size:17px}.chk.off span{display:block;font-size:14px;color:var(--muted);max-width:70ch}
.chkmsg{flex-basis:100%;margin:0;font-size:13.5px;font-weight:600;color:var(--ok)}.chkmsg:empty{display:none}
#chktxt{flex-basis:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;background:var(--bg);color:var(--ink)}
.pit{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}.pit select{border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;min-height:34px;background:var(--bg);font-size:14px}
.ql{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 18px}
.qlk{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;max-width:100%}
.qlk a{display:flex;flex-direction:column;padding:8px 6px 8px 14px;text-decoration:none;min-width:0}.qlk a:hover b{text-decoration:underline}
.qlk small{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.qlk b{color:var(--acc);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.qlk.q-page{border-color:var(--acc)}.qlk.q-pin{border-style:dashed}
.qlk button{border:0;background:transparent;color:var(--muted);font-size:18px;min-width:36px;cursor:pointer}.qlk button:hover{color:var(--ink);background:var(--surf)}
.qlh{margin:0 0 16px}
.types{display:flex;flex-wrap:wrap;gap:6px}
.pill2{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;min-height:32px;font-size:13px;font-weight:600;cursor:pointer}
.pill2[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.files{margin:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.files b{color:var(--ink);font-weight:600}
.pinm{color:var(--acc);font-weight:600}
.tr{display:grid;justify-items:end;gap:4px}.ver{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
footer{margin-top:44px;font-size:12.5px;color:var(--muted)}
.quick{display:flex;gap:6px;padding:0 8px}
.qbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;border-radius:9px;border:1.5px solid var(--sideline);background:var(--bg);color:var(--sideink);font-weight:600;font-size:13px;text-decoration:none}
.qbtn:hover{border-color:var(--acc);color:var(--acc)}.qbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.qbtn.pri:hover{color:#fff;filter:brightness(1.08)}
.sidehb{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;color:var(--sidemut);font-size:11.5px;font-weight:600;padding:4px 10px;margin-bottom:4px;cursor:pointer;border-radius:8px}
.sidehb:hover{background:var(--sidehov)}.sidehb .chev{transition:transform .15s}.sidehb[aria-expanded=false] .chev{transform:rotate(-90deg)}
.trow{display:flex;align-items:stretch;gap:2px}.trow>button[data-topic]{flex:1}
.tx{flex:none;width:30px;border:0;background:transparent;color:var(--sidemut);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tx:hover{background:var(--sidehov);color:var(--sideink)}.tx svg{transition:transform .15s}.tx[aria-expanded=true] svg{transform:rotate(90deg)}
.tsub{list-style:none;margin:0 0 6px 30px;padding:0 0 0 8px;border-left:1.5px solid var(--sideline);display:grid;gap:1px}
.tsub button{width:100%;border:0;background:transparent;color:var(--sideink);text-align:left;font-size:12.5px;padding:5px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub button:hover{background:var(--sidehov)}.tsub .all{color:var(--acc);font-weight:600}
.sched{display:grid;gap:10px}
.task{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);display:grid;gap:6px}
.task.bad{border-left:4px solid #d6373b}.task.off{opacity:.75}
.task .th{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}.task h3{font-size:16px}
.task .tm{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}.task .tm b{color:var(--ink);font-weight:600}
.chip{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--surf);color:var(--muted)}
.chip.on{background:var(--oksoft);color:var(--ok)}.chip.bad{background:light-dark(#fdecec,#3a1717);color:light-dark(#b42318,#ff8a80)}
.flagl{font-size:13px;font-weight:600;color:light-dark(#b42318,#ff8a80);margin:0}
.task .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;gap:12px;padding:16px}.nav{display:flex;overflow-x:auto;gap:6px}.nav button{white-space:nowrap;width:auto;background:#ffffff10}.sidef{display:none}}
@media(prefers-reduced-motion:reduce){.card,.hub,.drawer,.bulk{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><b>Topics Hub</b><span>with Timeback Machine™</span></div>
  <div class="quick"><a class="qbtn pri" href="https://claude.ai/new" target="_blank" rel="noopener" title="Start a new Claude chat in a new tab">+ New chat</a><a class="qbtn" href="https://claude.ai/projects" target="_blank" rel="noopener" title="Your Claude projects. New project is at the top right of that page.">Projects</a></div>
  <nav class="nav" id="nav" aria-label="Views"></nav>
  <div class="sidef"><button type="button" class="sidehb" id="tcol" aria-expanded="true" aria-controls="tnav"><span>Your topics</span><svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><nav class="nav" id="tnav" aria-label="Topics"></nav></div>
  <div class="sidef"><div class="sideh">Status</div><div class="pills" id="stp"></div></div>
</aside>
<main>
  <div id="dchk"></div>
  <div class="top"><div><h1 id="h1">Your topics</h1><p id="sub"></p></div><div class="tr"><span class="ver" id="ver"></span><a class="desk" id="desk" target="_blank" rel="noopener" hidden>Add to my desktop</a><span class="status" id="status">Loading...</span></div></div>
  <div id="upd"></div>
  <label class="cmd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search your work, or ask a question" aria-label="Search or ask"><span class="kbd">/</span></label>
  <p class="hint">Typing filters as you go. Ask a question of three or more words, then press Enter, and Claude answers.</p>
  <div class="ask" id="ask" role="status"></div>
  <div class="stats" id="stats"></div>
  <div id="board"></div>
  <footer id="foot"></footer>
</main>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dtitle"></div>
<div class="bulk" id="bulk" role="region" aria-label="Bulk actions"></div>

<script>
{
const APP_VERSION="1.3";
const TODAY=new Date();
const ST={act:"Active",ref:"Reference",stale:"Stale",arch:"Archived"};
const FORM={schedule:"Scheduled task",skill:"Skill",app:"Micro-app",checklist:"Checklist"};
const S={links:{},type:"",cards:{},over:{},hubs:{},props:{},main:{},tasks:{},upd:{},sync:{},acts:{},view:"home",topic:"",q:"",st:new Set(),focus:null,hits:null,sel:new Set(),db:null,sample:null,mcp:null,loaded:false,tcol:false,texp:new Set(),sch:{list:null,at:"",err:"",loading:false,overlap:[],confirm:"",msg:""}};
try{S.tcol=localStorage.getItem("th-tcol")==="1";S.texp=new Set(JSON.parse(localStorage.getItem("th-texp")||"[]"))}catch(e){}
function remember(){try{localStorage.setItem("th-tcol",S.tcol?"1":"0");localStorage.setItem("th-texp",JSON.stringify([...S.texp]))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr=x=>Array.isArray(x)?x.filter(v=>typeof v==="string"):[];
const safeUrl=u=>/^https:\/\//.test(u||"")?u:"";
const cardUrl=c=>safeUrl(c.url)||(/^[A-Za-z0-9]{10,40}$/.test(c.code)?"https://claude.ai/artifact/"+c.code:"");
const days=d=>{const t=new Date(String(d||"")+"T12:00:00Z");return isNaN(t)?999:Math.floor((TODAY-t)/864e5)};
const rel=d=>{const n=days(d);if(n>=999)return"";if(n<=0)return"Today";if(n===1)return"Yesterday";if(n<14)return n+" days ago";return new Date(d+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"})};

function all(){
  return Object.entries(S.cards).map(([code,c])=>{const o=S.over[code]||{};return {code,title:String(c.title||"Untitled"),kind:String(c.kind||""),date:String(c.date||""),desc:String(c.desc||""),url:c.url,
    topics:Array.isArray(o.topics)?arr(o.topics):arr(c.topics),companies:arr(c.companies),files:arr(c.files).slice(0,40),pin:!!o.pin,sug:String(c.sug||""),piId:String(c.piId||""),archived:!!o.archived,keep:!!o.keep}});
}
function status(c){if(c.archived)return"arch";const d=days(c.date);if(d<=14)return"act";return d<=45?"ref":"stale"}
function topicsList(list){const m={};list.filter(c=>!c.archived).forEach(c=>c.topics.forEach(t=>m[t]=(m[t]||0)+1));Object.values(S.hubs).forEach(h=>{if(h&&h.topic&&!(h.topic in m))m[h.topic]=0});return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}
function hubFor(t){return Object.values(S.hubs).find(h=>h&&h.topic===t&&safeUrl(h.url))}
const TYPES=[["","All"],["pages","Pages and apps"],["docs","Documents"],["chats","Chats"]];
function kindGroup(k){k=String(k||"").toLowerCase();if(/chat/.test(k))return"chats";if(/doc|slide|deck|sheet|report|memo|pdf|word|excel|presentation|brief|letter|resume|spreadsheet/.test(k))return"docs";return"pages"}
function linksFor(t){const e=Object.entries(S.links).find(([id,l])=>l&&l.topic===t);return e?Object.assign({id:e[0]},e[1]):null}
const LK={page:"Open",website:"Website",repo:"GitHub",pin:"Pinned"};
function quickLinks(t,list){
  const L=linksFor(t),rm=L&&Array.isArray(L.removed)?L.removed:[];
  const auto=(L&&Array.isArray(L.items)?L.items:[]).filter(x=>x&&safeUrl(x.url)&&!rm.includes(x.url)).slice(0,5);
  const pins=list.filter(c=>c.pin&&!c.archived&&c.topics.includes(t)&&cardUrl(c)&&!auto.some(x=>x.url===cardUrl(c)));
  const it=auto.map(x=>({kind:LK[x.kind]?x.kind:"page",label:String(x.label||x.url),url:x.url,rm:'data-rmlink="'+esc(x.url)+'"'})).concat(pins.map(c=>({kind:"pin",label:c.title,url:cardUrl(c),rm:'data-unpin="'+esc(c.code)+'"'})));
  if(!it.length)return'<p class="status qlh">Quick links appear here when Timeback Machine™ finds this topic\'s main page, website or GitHub repository. You can also pin any card here.</p>';
  return'<div class="ql" aria-label="Quick links">'+it.map(x=>'<span class="qlk q-'+x.kind+'"><a href="'+esc(x.url)+'" target="_blank" rel="noopener"><small>'+LK[x.kind]+'</small><b>'+esc(x.label)+'</b></a><button type="button" '+x.rm+' aria-label="Remove '+esc(x.label)+' from quick links" title="Remove">×</button></span>').join("")+'</div>';
}
function props(st){return Object.entries(S.props).map(([id,p])=>Object.assign({id},p)).filter(p=>(st||["proposed"]).includes(p.status))}
function visible(c){
  if(S.view==="archive"){if(!c.archived)return false}else if(c.archived)return false;
  if(S.view==="unsorted"&&c.topics.length)return false;
  if(S.topic&&!c.topics.includes(S.topic))return false;
  if(S.st.size&&!S.st.has(status(c)))return false;
  if(S.topic&&S.type&&kindGroup(c.kind)!==S.type)return false;
  if(S.hits)return S.hits.includes(c.code);
  if(S.q){const t=(c.title+" "+c.desc+" "+c.topics.join(" ")+" "+c.companies.join(" ")+" "+c.files.join(" ")+" "+c.kind).toLowerCase();return S.q.toLowerCase().split(/\s+/).every(w=>t.includes(w))}
  return true;
}

function newer(a,b){const x=String(a).split(".").map(Number),y=String(b).split(".").map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false}

const DOW=["Sundays","Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays"];
function hm(h,m){h=+h;m=+m;const ap=h>=12?"PM":"AM";return ((h%12)||12)+":"+String(m).padStart(2,"0")+" "+ap}
function cronText(c){
  c=String(c||"").replace(/^CRON_TZ=\S+\s+/,"").trim();const f=c.split(/\s+/);if(f.length!==5)return c;
  const [mi,ho,dm,mo,dw]=f;if(!/^\d+$/.test(mi)||!/^[\d,]+$/.test(ho))return c;
  const hs=ho.split(",");const times=hs.map(x=>hm(x,mi));const t=times.length>1?times.slice(0,-1).join(", ")+" and "+times[times.length-1]:times[0];
  if(mo!=="*")return c;
  if(dm==="*"&&dw==="*")return "Every day at "+t;
  if(dm==="*"&&dw==="1-5")return "Weekdays at "+t;
  if(dm==="*"&&/^\d$/.test(dw))return DOW[+dw%7]+" at "+t;
  if(/^\d+$/.test(dm)&&dw==="*")return "Day "+dm+" of each month at "+t;
  return c}
function when(iso){if(!iso)return "";const d=new Date(iso);if(isNaN(d))return "";return d.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function taskState(t){
  const lr=t.last_run||{},st=String(lr.status||"");
  return {failed:/FAILED|ERROR|TIMED_OUT/.test(st),worked:/SUCCEEDED/.test(st),off:t.enabled===false,once:!!t.run_once_at,manual:!t.cron_expression&&!t.run_once_at}}
function schedProblems(){const L=S.sch.list||[];const p=[];L.forEach(t=>{if(t.enabled!==false&&taskState(t).failed)p.push({id:t.id,text:"The last run failed."})});(S.sch.overlap||[]).forEach(o=>p.push({id:o.a,text:o.why,pair:o.b}));return p}
function payloadOf(r){let p=r&&("payload" in r)?r.payload:r;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}return p||{}}
async function loadSched(force){
  if(!S.mcp||S.sch.loading)return;if(S.sch.list&&!force)return;
  S.sch.loading=true;S.sch.err="";render();
  try{let all=[],cursor="",pages=0;
    do{const inp={limit:100};if(cursor)inp.cursor=cursor;const p=payloadOf(await S.mcp.callTool("Claude Code Remote","list_triggers",inp,{cache:false}));
      (Array.isArray(p.data)?p.data:[]).forEach(t=>all.push(t));cursor=p.has_more&&p.next_cursor?p.next_cursor:"";pages++}while(cursor&&pages<5);
    S.sch.list=all;S.sch.at=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    S.sch.ovDone=false;if(S.view==="scheduled")checkOverlap();
  }catch(e){const c=e&&e.code;
    S.sch.err=c==="not_in_manifest"?"perm":c==="approval_required"?"approve":(c==="needs_reauth"||c==="server_not_connected")?"connect":"other";S.sch.errMsg=String(e&&e.message||"")}
  S.sch.loading=false;render()}
async function checkOverlap(){
  if(S.sch.ovDone)return;S.sch.ovDone=true;
  const L=(S.sch.list||[]).filter(t=>t.enabled!==false&&(t.cron_expression||t.run_once_at));if(!S.sample||L.length<2)return;
  const lines=L.map(t=>t.id+" | "+String(t.name||"")+" | "+String((t.derived_state&&t.derived_state.prompt)||"").replace(/\s+/g," ").slice(0,500)).join("\n");
  try{const r=await S.sample.json("These are the owner's active scheduled tasks, one per line: id | name | start of its instructions.\n\n"+lines+"\n\nFind pairs of tasks that clearly do the same job, so one is probably left over and could be turned off. Ignore tasks that only share a data source or a page. Reply with only JSON: {\"pairs\": [{\"a\": id, \"b\": id, \"why\": one plain sentence naming both tasks and the job they both do}]}. Use an empty list when there are none.",{modelTier:"quick",cache:false});
    const ids=new Set(L.map(t=>t.id));S.sch.overlap=(Array.isArray(r&&r.pairs)?r.pairs:[]).filter(x=>x&&ids.has(x.a)&&ids.has(x.b)&&x.a!==x.b).map(x=>({a:x.a,b:x.b,why:String(x.why||"These two tasks look like they do the same job.")})).slice(0,5);render()}catch(e){}}
function taskHtml(t){
  const s=taskState(t),name=String(t.name||"Untitled task"),probs=schedProblems().filter(p=>p.id===t.id||p.pair===t.id);
  const sched=s.manual?"Runs only when a page or chat starts it":s.once?"Once, "+when(t.run_once_at):cronText(t.cron_expression);
  const last=t.last_run&&t.last_run.fired_at?when(t.last_run.fired_at)+(s.failed?" (failed)":s.worked?" (worked)":""):(t.last_fired_at?when(t.last_fired_at):"Not yet");
  let h='<article class="task'+(probs.length?" bad":"")+(s.off?" off":"")+'"><div class="th"><h3>'+esc(name)+'</h3><span class="chip '+(s.off?"":"on")+'">'+(s.off?"Off":"On")+'</span></div>';
  h+='<div class="tm"><span><b>Runs:</b> '+esc(sched)+'</span>'+(!s.off&&t.next_run_at&&!s.manual?'<span><b>Next:</b> '+esc(when(t.next_run_at))+'</span>':'')+'<span><b>Last run:</b> '+esc(last)+'</span></div>';
  probs.forEach(p=>{h+='<p class="flagl">'+esc(p.text)+'</p>'});
  if(!s.off){h+='<div class="acts">'+(S.sch.confirm===t.id?'<button class="btn pri sm" type="button" data-runok="'+esc(t.id)+'">Yes, run it now</button><button class="btn sm" type="button" data-runno="1">Cancel</button>':'<button class="btn sm" type="button" data-run="'+esc(t.id)+'">Run now</button>')+'</div>'}
  return h+'</article>'}
function schedHtml(){
  if(!S.mcp)return '<section class="grp"><div class="empty">Scheduled tasks can be shown only when this page is open in Claude.</div></section>';
  if(S.sch.err==="perm")return '<section class="grp"><div class="chk off"><div><b>This page needs one more permission to list your scheduled tasks.</b><span>Ask Claude in any chat: "Give my Topics Hub permission to list my scheduled tasks by adding the tool list_triggers to its Claude Code Remote connector." Then reload this page.</span></div></div></section>';
  if(S.sch.err==="approve")return '<section class="grp"><div class="chk off"><div><b>Claude needs your OK to read your scheduled tasks.</b><span>Press the button and approve the request.</span></div><button class="btn pri" type="button" id="schload">Allow and show my tasks</button></div></section>';
  if(S.sch.err==="connect")return '<section class="grp"><div class="empty">The scheduled-tasks connector (Claude Code Remote) needs to be reconnected in Claude Settings, under Connectors. Then reload this page.</div></section>';
  if(S.sch.err)return '<section class="grp"><div class="empty">Your scheduled tasks could not be read just now. <button class="lnk" type="button" id="schload">Try again</button></div></section>';
  if(!S.sch.list)return '<section class="grp"><div class="empty">Reading your scheduled tasks...</div></section>';
  const L=S.sch.list,probIds=new Set(schedProblems().flatMap(p=>[p.id,p.pair]).filter(Boolean));
  const groups=[["Needs a look",L.filter(t=>probIds.has(t.id))],["On",L.filter(t=>!probIds.has(t.id)&&t.enabled!==false)],["Turned off",L.filter(t=>!probIds.has(t.id)&&t.enabled===false)]];
  let h=S.sch.msg?'<p class="chkmsg" style="margin-top:14px">'+esc(S.sch.msg)+'</p>':'';
  h+='<p class="status" style="margin:14px 0 0">'+L.length+' tasks. Read at '+esc(S.sch.at)+'. <button class="lnk" type="button" id="schload">Refresh</button></p>';
  groups.forEach(([n,ts])=>{if(ts.length)h+='<section class="grp"><div class="gh"><h2>'+n+' <span class="status">'+ts.length+'</span></h2></div><div class="sched">'+ts.map(taskHtml).join("")+'</div></section>'});
  if(!L.length)h+='<section class="grp"><div class="empty">No scheduled tasks yet.</div></section>';
  return h}
function setStatus(t){$("status").textContent=t}
async function put(path,data){if(!S.db){setStatus("Sign in to save changes.");return false}try{await S.db.doc(path).set(data);setStatus("Saved");return true}catch(e){setStatus("Could not save. Try again.");return false}}
async function save(code,patch){const o=Object.assign({},S.over[code]||{},patch);S.over[code]=o;render();await put("state/"+code,o)}
async function saveMany(codes,fn){setStatus("Saving "+codes.length+" changes...");for(const c of codes)S.over[c]=fn(Object.assign({},S.over[c]||{}),c);render();for(const c of codes){if(!await put("state/"+c,S.over[c]))return}setStatus("Saved "+codes.length+" changes")}
function topicsOf(code){const c=all().find(x=>x.code===code);return c?c.topics.slice():[]}
async function fire(text){
  if(!S.mcp||!S.tasks.daily)return false;
  try{await S.mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:S.tasks.daily,text},{cache:false});return true}catch(e){return false}
}
async function decide(id,status){
  const p=Object.assign({},S.props[id]||{},{status,decidedAt:new Date().toISOString()});S.props[id]=p;render();

async function ask(qs){
  const box=$("ask");box.className="ask on";
  if(!S.sample){box.textContent="Asking Claude is not available in this view. The search box still filters by words.";return}
  box.textContent="Asking Claude...";
  const cat=all().filter(c=>!c.archived).map(c=>c.code+" | "+c.title+" | "+c.topics.join(", ")+" | "+c.companies.join(", ")+" | "+c.date+" | "+c.desc).join("\n");
  const hubs=Object.values(S.hubs).map(h=>h.title+": "+h.url).join("\n");
  try{const r=await S.sample.json("You help the owner of this page find their own work. Catalog, one item per line: code | title | topics | companies | last updated | description.\n\n"+cat+"\n\nTopic hubs:\n"+hubs+"\n\nTheir question: "+qs+"\n\nReply with only JSON: {\"answer\": one or two plain sentences that answer them and name the best match, \"codes\": up to 8 codes from the catalog, best match first}.",{modelTier:"quick",cache:false});
    S.hits=(Array.isArray(r&&r.codes)?r.codes:[]).filter(x=>typeof x==="string");S.view="all";S.topic="";
    box.innerHTML="";const p=document.createElement("span");p.textContent=String(r&&r.answer||"No match found.");box.appendChild(p);
    const b=document.createElement("button");b.className="btn sm";b.type="button";b.textContent="Clear";b.onclick=()=>{S.hits=null;$("q").value="";S.q="";box.className="ask";render()};box.appendChild(b);render();
  }catch(e){box.textContent=e&&e.code==="not_granted"?"Claude was not allowed to answer here. The search box still filters by words.":"Claude could not answer just now. Try again in a minute."}

function newTopicFlow(sel,apply){

(async()=>{
