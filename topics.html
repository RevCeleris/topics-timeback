<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topics Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE: calm and quick for someone whose chats have piled up; nothing to learn before it helps.
   IDEA: a home for your work that files itself, with Timeback Machine™ bringing you suggestions to approve.
   PICTURE: the home screen: topic hubs, the suggestions inbox, and the time Timeback Machine™ has found.
   COLOUR and TYPE: ink sidebar, white canvas, cobalt for actions, green for active work and time saved; Inter Tight over Inter.
   LAYOUT: sidebar with views and topics, then command bar, stats, inbox, hubs and cards. Stacks on phones. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c0d10);--surf:light-dark(#f4f5f7,#14161b);--card:light-dark(#ffffff,#191c22);
--ink:light-dark(#0f1115,#eef0f3);--muted:light-dark(#5b6270,#9aa1ad);--line:light-dark(#e5e7eb,#272b33);
--side:light-dark(#0f1115,#07080a);--sideink:#e9ebef;--sidemut:#8b93a1;
--acc:light-dark(#2b59ff,#7a95ff);--accsoft:light-dark(#eef2ff,#1b2240);
--ok:light-dark(#0f9d58,#3ccf84);--oksoft:light-dark(#e9f7ef,#13261b);--stale:light-dark(#9aa3b2,#5d6573)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:var(--sideink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:20px}
.brand{padding:0 8px}.brand b{display:block;font:800 22px/1.1 "Inter Tight",sans-serif}.brand span{font-size:12.5px;color:var(--sidemut)}
.nav{display:grid;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--sideink);border-radius:9px;padding:9px 10px;min-height:40px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:#ffffff10}.nav button[aria-current=true]{background:#ffffff1c;font-weight:600}
.nav button.over{outline:2px solid var(--acc)}
.nav small{color:var(--sidemut);font-variant-numeric:tabular-nums}.nav .hot small{background:var(--acc);color:#fff;border-radius:999px;padding:0 7px}
.sideh{font-size:11.5px;font-weight:600;color:var(--sidemut);padding:0 10px;margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px}
.pill{border:1px solid #ffffff2a;background:transparent;color:var(--sideink);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.pill[aria-pressed=true]{background:#fff;color:#0f1115;border-color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-act{background:var(--ok)}.d-ref{background:var(--acc)}.d-stale{background:var(--stale)}.d-arch{border:1.5px dashed var(--stale)}
main{padding:22px clamp(16px,3vw,36px) 120px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--muted)}
.cmd{display:flex;align-items:center;gap:10px;margin:18px 0 6px;background:var(--surf);border:1.5px solid transparent;border-radius:14px;padding:4px 6px 4px 14px}
.cmd:focus-within{border-color:var(--acc);background:var(--bg)}
.cmd svg{flex:none;color:var(--muted)}.cmd input{flex:1;border:0;background:transparent;padding:11px 0;font-size:16px;outline:0}
.kbd{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin:0 0 6px 4px}
.ask{display:none;margin:8px 0;padding:14px 16px;border-radius:14px;background:var(--accsoft);align-items:flex-start;gap:12px;justify-content:space-between}.ask.on{display:flex}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:14px;background:var(--accsoft);margin-top:14px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.stat{background:var(--surf);border-radius:12px;padding:10px 14px;min-width:130px}
.stat b{display:block;font:800 24px/1.1 "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--muted)}
.stat.g b{color:var(--ok)}
section.grp{margin-top:32px}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.gh h2{font-size:23px;font-weight:700;letter-spacing:-.01em}.gh p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
.gh .lnk{border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:4px}
.props{display:grid;gap:10px}
.prop{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;background:var(--card)}
.prop.fix{border-left:4px solid var(--ok)}.prop.topic{border-left:4px solid var(--acc)}.prop.pi{border-left:4px solid var(--muted)}
.prop .k{font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prop .tb{color:var(--ok)}
.prop h3{font-size:17px}.prop p{margin:0;font-size:14px;color:var(--muted)}
.prop .ev{display:flex;flex-wrap:wrap;gap:6px}.prop .ev a{font-size:12.5px;background:var(--surf);border-radius:6px;padding:2px 8px;text-decoration:none}
.prop .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prop pre{white-space:pre-wrap;background:var(--surf);border-radius:10px;padding:10px 12px;margin:0;font:13px/1.5 ui-monospace,Menlo,monospace;max-height:180px;overflow:auto}
.prop ol{margin:0;padding-left:20px;font-size:14px}
.btn{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 13px;min-height:38px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--ink)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{min-height:32px;padding:4px 10px;font-size:12.5px}
.btn:focus-visible,.nav button:focus-visible,.pill:focus-visible,.card:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.hub{border-radius:16px;padding:18px;background:var(--acc);color:#fff;display:flex;flex-direction:column;gap:6px;min-height:140px;text-decoration:none;transition:transform .15s}
.hub:hover{transform:translateY(-2px)}.hub small{opacity:.85;font-size:12.5px}.hub h3{font-size:21px}.hub p{margin:0;font-size:13.5px;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;display:grid;gap:5px;transition:box-shadow .15s,transform .15s,opacity .15s;align-content:start}
.card:hover{box-shadow:0 6px 18px -8px #0f111540;transform:translateY(-1px)}
.card.st-act{border-color:light-dark(#bfe3cc,#1f4a30)}.card.st-stale .ttl{color:var(--muted)}.card.st-arch{border-style:dashed;opacity:.8}
.card.sel{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}.card.focus{box-shadow:0 0 0 2.5px var(--ink)}
.meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stp{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.pk{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;opacity:0;transition:opacity .1s}
.card:hover .pk,.card.sel .pk,body.selecting .pk,.pk:focus-within{opacity:1}@media(hover:none){.pk{opacity:1}}
.pk input{width:18px;height:18px;accent-color:var(--acc);cursor:pointer;margin:0}
.ttl{font-weight:600;font-size:14.5px;line-height:1.3}
.desc{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{border:0;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;cursor:pointer;background:var(--accsoft);color:var(--acc)}
.tag.c{background:var(--surf);color:var(--ink)}
.flag{font-size:11.5px;font-weight:600;color:var(--acc)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1.5px dashed var(--line);border-radius:14px}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-20px 0 40px -20px #0f111540;transform:translateX(102%);transition:transform .2s;z-index:20;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.dh h2{font-size:20px}
.db{padding:18px 20px;overflow:auto;display:grid;gap:16px;align-content:start}
.db h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.db ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.db li button{border:0;background:var(--surf);border-radius:8px;padding:7px 10px;width:100%;text-align:left;cursor:pointer;font-size:13.5px}
.db select{border:1.5px solid var(--line);border-radius:10px;padding:8px;min-height:40px;background:var(--bg);width:100%}
.bulk{position:fixed;left:50%;bottom:22px;transform:translate(-50%,160%);background:var(--side);color:#fff;border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 18px 40px -12px #0008;transition:transform .2s;z-index:25;max-width:calc(100vw - 24px)}
.bulk.on{transform:translate(-50%,0)}.bulk b{padding:0 6px}
.bulk .btn{background:transparent;color:#fff;border-color:#ffffff44}.bulk .btn.pri{background:var(--acc);border-color:var(--acc)}
.bulk select{border-radius:10px;padding:6px;min-height:36px;background:#ffffff14;color:#fff;border:1px solid #ffffff44}.bulk select option{color:#0f1115}
.status{font-size:12.5px;color:var(--muted)}
.tr{display:grid;justify-items:end;gap:4px}.ver{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
footer{margin-top:44px;font-size:12.5px;color:var(--muted)}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;gap:12px;padding:16px}.nav{display:flex;overflow-x:auto;gap:6px}.nav button{white-space:nowrap;width:auto;background:#ffffff10}.sidef{display:none}}
@media(prefers-reduced-motion:reduce){.card,.hub,.drawer,.bulk{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><b>Topics Hub</b><span>with Timeback Machine™</span></div>
  <nav class="nav" id="nav" aria-label="Views"></nav>
  <div class="sidef"><div class="sideh">Your topics</div><nav class="nav" id="tnav" aria-label="Topics"></nav></div>
  <div class="sidef"><div class="sideh">Status</div><div class="pills" id="stp"></div></div>
</aside>
<main>
  <div class="top"><div><h1 id="h1">Your topics</h1><p id="sub"></p></div><div class="tr"><span class="ver" id="ver"></span><span class="status" id="status">Loading...</span></div></div>
  <div id="upd"></div>
  <label class="cmd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search your work, or ask a question" aria-label="Search or ask"><span class="kbd">/</span></label>
  <p class="hint">Typing filters as you go. Ask a question of three or more words, then press Enter, and Claude answers.</p>
  <div class="ask" id="ask" role="status"></div>
  <div class="stats" id="stats"></div>
  <div id="board"></div>
  <footer id="foot"></footer>
</main>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dtitle"></div>
<div class="bulk" id="bulk" role="region" aria-label="Bulk actions"></div>

<script>
{
const APP_VERSION="1.0";
const TODAY=new Date();
const ST={act:"Active",ref:"Reference",stale:"Stale",arch:"Archived"};
const FORM={schedule:"Scheduled task",skill:"Skill",app:"Micro-app",checklist:"Checklist"};
const S={cards:{},over:{},hubs:{},props:{},main:{},tasks:{},upd:{},sync:{},acts:{},view:"home",topic:"",q:"",st:new Set(),focus:null,hits:null,sel:new Set(),db:null,sample:null,mcp:null,loaded:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr=x=>Array.isArray(x)?x.filter(v=>typeof v==="string"):[];
const safeUrl=u=>/^https:\/\//.test(u||"")?u:"";
const cardUrl=c=>safeUrl(c.url)||(/^[A-Za-z0-9]{10,40}$/.test(c.code)?"https://claude.ai/artifact/"+c.code:"");
const days=d=>{const t=new Date(String(d||"")+"T12:00:00Z");return isNaN(t)?999:Math.floor((TODAY-t)/864e5)};
const rel=d=>{const n=days(d);if(n>=999)return"";if(n<=0)return"Today";if(n===1)return"Yesterday";if(n<14)return n+" days ago";return new Date(d+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"})};

function all(){
  return Object.entries(S.cards).map(([code,c])=>{const o=S.over[code]||{};return {code,title:String(c.title||"Untitled"),kind:String(c.kind||""),date:String(c.date||""),desc:String(c.desc||""),url:c.url,
    topics:Array.isArray(o.topics)?arr(o.topics):arr(c.topics),companies:arr(c.companies),sug:String(c.sug||""),piId:String(c.piId||""),archived:!!o.archived,keep:!!o.keep}});
}
function status(c){if(c.archived)return"arch";const d=days(c.date);if(d<=14)return"act";return d<=45?"ref":"stale"}
function topicsList(list){const m={};list.filter(c=>!c.archived).forEach(c=>c.topics.forEach(t=>m[t]=(m[t]||0)+1));Object.values(S.hubs).forEach(h=>{if(h&&h.topic&&!(h.topic in m))m[h.topic]=0});return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}
function hubFor(t){return Object.values(S.hubs).find(h=>h&&h.topic===t&&safeUrl(h.url))}
function props(st){return Object.entries(S.props).map(([id,p])=>Object.assign({id},p)).filter(p=>(st||["proposed"]).includes(p.status))}
function visible(c){
  if(S.view==="archive"){if(!c.archived)return false}else if(c.archived)return false;
  if(S.view==="unsorted"&&c.topics.length)return false;
  if(S.topic&&!c.topics.includes(S.topic))return false;
  if(S.st.size&&!S.st.has(status(c)))return false;
  if(S.hits)return S.hits.includes(c.code);
  if(S.q){const t=(c.title+" "+c.desc+" "+c.topics.join(" ")+" "+c.companies.join(" ")+" "+c.kind).toLowerCase();return S.q.toLowerCase().split(/\s+/).every(w=>t.includes(w))}
  return true;
}
function timeBackFound(){return Object.values(S.props).filter(p=>p&&p.kind==="fix"&&["requested","ready","done"].includes(p.status)).reduce((a,p)=>a+(+p.hoursPerWeek||0),0)}

function render(){
  const list=all(),live=list.filter(c=>!c.archived),inbox=props(),tl=topicsList(list),first=(S.main.name||"").split(" ")[0];
  document.title=(S.main.name?S.main.name+" - ":"")+"Topics Hub";
  $("ver").textContent="Version "+APP_VERSION;
  const views=[["home","Home",""],["inbox","Suggestions",inbox.length,inbox.length?"hot":""],["all","All work",live.length],["unsorted","Unsorted",live.filter(c=>!c.topics.length).length],["archive","Archive",list.length-live.length]];
  $("nav").innerHTML=views.map(v=>'<button type="button" class="'+(v[3]||"")+'" data-view="'+v[0]+'"'+(v[0]==="archive"?' id="archnav"':'')+' aria-current="'+(S.view===v[0]&&!S.topic)+'">'+v[1]+(v[2]!==""?'<small>'+v[2]+'</small>':'')+'</button>').join("");
  $("tnav").innerHTML=tl.length?tl.map(([t,n])=>'<button type="button" data-topic="'+esc(t)+'" aria-current="'+(S.topic===t)+'">'+esc(t)+'<small>'+n+'</small></button>').join(""):'<p class="status" style="padding:0 10px;color:var(--sidemut)">None yet</p>';
  $("stp").innerHTML=["act","ref","stale"].map(k=>'<button class="pill" type="button" data-st="'+k+'" aria-pressed="'+S.st.has(k)+'"><span class="dot d-'+k+'"></span>'+ST[k]+'</button>').join("");
  const titles={home:first?"Welcome back, "+first:"Your topics",inbox:"Suggestions",all:"All work",unsorted:"Unsorted",archive:"Archive"};
  $("h1").textContent=S.topic||titles[S.view];
  const s=S.sync||{};
  $("sub").textContent=S.topic?"Everything filed under this topic.":S.view==="archive"?"Hidden from every other view. Nothing here is deleted.":S.view==="unsorted"?"Work that has not joined a topic yet.":(s.lastRun?"Timeback Machine™ last checked your work "+s.lastRun+".":"Timeback Machine™ checks your work every day.");
  const hrs=timeBackFound();
  $("stats").innerHTML=[["",tl.length,"topics"],["",live.length,"items filed"],["",inbox.length,"waiting for you"],["g",(Math.round(hrs*10)/10)+" hrs","a week given back"]].map(n=>'<div class="stat '+n[0]+'"><b>'+esc(n[1])+'</b><span>'+n[2]+'</span></div>').join("");
  renderUpdate();
  let h="";
  if(!S.loaded){h='<div class="empty" style="margin-top:20px">Loading your topics...</div>'}
  else if(!list.length&&!inbox.length&&!Object.keys(S.hubs).length){h='<section class="grp"><div class="empty">Setup is reading your recent chats and work. Your first topics and suggestions appear here in a few minutes. Leave this page open or come back later.</div></section>'}
  else if(S.topic){const hb=hubFor(S.topic);
    h+='<section class="grp">'+(hb?'<div class="hubs"><a class="hub" href="'+esc(hb.url)+'" target="_blank" rel="noopener"><small>Topic hub'+(hb.lastRefreshed?" · updated "+esc(hb.lastRefreshed):"")+'</small><h3>'+esc(hb.title||S.topic)+'</h3><p>'+esc(hb.summary||"")+'</p></a></div>':'<p class="status">No hub for this topic yet. Timeback Machine™ suggests one when the topic keeps coming up.</p>')+'</section>';
    h+=gridSection("Filed here",list.filter(visible));}
  else if(S.view==="home"){
    if(inbox.length)h+='<section class="grp"><div class="gh"><h2>Waiting for you</h2><button class="lnk" type="button" data-view="inbox">See all '+inbox.length+'</button></div><div class="props">'+inbox.slice(0,3).map(propHtml).join("")+'</div></section>';
    const ready=props(["ready"]);if(ready.length)h+='<section class="grp"><div class="gh"><h2>Ready to set up</h2><p>Approved suggestions with the steps to finish them.</p></div><div class="props">'+ready.map(propHtml).join("")+'</div></section>';
    h+=hubsHtml(tl);
    const recent=live.filter(visible).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
    h+=gridSection("Recent work",recent,'<button class="lnk" type="button" data-view="all">See all</button>');
  }
  else if(S.view==="inbox"){const g=[["topic","Suggested hubs","Subjects that keep coming up where you are deciding or building something. A hub keeps each one organized and current."],["fix","Timeback Machine™ suggestions","Work you keep repeating, with the time you would get back."],["pi","Prior Inventions candidates","Things you built that may belong on your Prior Inventions list."]];
    const all2=props();h+=g.map(([k,n,l])=>{const ps=all2.filter(p=>p.kind===k);return ps.length?'<section class="grp"><div class="gh"><h2>'+n+'</h2><p>'+l+'</p></div><div class="props">'+ps.map(propHtml).join("")+'</div></section>':""}).join("")||'<section class="grp"><div class="empty">Nothing waiting. Timeback Machine™ adds suggestions here after its daily check.</div></section>';
    const ready=props(["ready","requested"]);if(ready.length)h+='<section class="grp"><div class="gh"><h2>Approved</h2><p>Being built, or ready for you to finish.</p></div><div class="props">'+ready.map(propHtml).join("")+'</div></section>';}
  else if(S.view==="all"){tl.forEach(([t])=>{const cs=list.filter(c=>c.topics.includes(t)&&visible(c));if(cs.length)h+=gridSection(t,cs,'<button class="lnk" type="button" data-topic="'+esc(t)+'">Open topic</button>')});
    const un=list.filter(c=>!c.topics.length&&visible(c));if(un.length)h+=gridSection("Unsorted",un);if(!h)h='<section class="grp"><div class="empty">Nothing matches.</div></section>'}
  else h+=gridSection(S.view==="archive"?"Archived":"Unsorted",list.filter(visible));
  $("board").innerHTML=h;
  renderBulk(list);renderDrawer(list);document.body.classList.toggle("selecting",S.sel.size>0);
  $("foot").textContent="Topics Hub with Timeback Machine™, version "+APP_VERSION+". Free for personal use under CC BY-NC 4.0. Private to you until you share it.";
}
function hubsHtml(tl){const hs=Object.entries(S.hubs).map(([id,x])=>Object.assign({id},x)).filter(x=>safeUrl(x.url));
  return '<section class="grp"><div class="gh"><h2>Topic hubs</h2><p>One page per subject, kept current by Timeback Machine™.</p></div>'+(hs.length?'<div class="hubs">'+hs.map(x=>'<a class="hub" href="'+esc(x.url)+'" target="_blank" rel="noopener"><small>'+esc(x.topic||"Topic hub")+(x.lastRefreshed?" · updated "+esc(x.lastRefreshed):"")+'</small><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary||"")+'</p></a>').join("")+'</div>':'<div class="empty">No hubs yet. When a subject keeps coming up, Timeback Machine™ suggests one in your Suggestions.</div>')+'</section>'}
function gridSection(title,cs,extra){cs=cs.slice().sort((a,b)=>b.date.localeCompare(a.date));return '<section class="grp"><div class="gh"><h2>'+esc(title)+' <span class="status">'+cs.length+'</span></h2>'+(extra||"")+'</div>'+(cs.length?'<div class="grid">'+cs.map(card).join("")+'</div>':'<div class="empty">Nothing here.</div>')+'</section>'}
function propHtml(p){
  const ev=(Array.isArray(p.evidence)?p.evidence:[]).filter(e=>e&&safeUrl(e.url)).slice(0,6);
  const kind={topic:"Suggested hub",fix:"Timeback Machine™",pi:"Prior Inventions"}[p.kind]||"Suggestion";
  let h='<div class="prop '+esc(p.kind)+'"><div class="k"><span>'+kind+'</span>'+(p.kind==="fix"&&p.hoursPerWeek?'<span class="tb">About '+esc(p.hoursPerWeek)+' hrs a week back</span>':'')+(p.form&&FORM[p.form]?'<span>'+FORM[p.form]+'</span>':'')+(p.topic&&p.kind!=="topic"?'<span>'+esc(p.topic)+'</span>':'')+'</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.why||"")+'</p>';
  if(ev.length)h+='<div class="ev">'+ev.map(e=>'<a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.label||"Source")+'</a>').join("")+'</div>';
  if(p.status==="proposed")h+='<div class="acts"><button class="btn pri sm" type="button" data-yes="'+esc(p.id)+'">'+(p.kind==="topic"?"Create hub":p.kind==="pi"?"Add to Prior Inventions":"Yes, set it up")+'</button><button class="btn sm" type="button" data-later="'+esc(p.id)+'">Not now</button><button class="btn sm" type="button" data-never="'+esc(p.id)+'">Never</button></div>';
  else if(p.status==="requested")h+='<p class="status">Approved. Claude is working on it and will notify you.</p>';
  else if(p.status==="ready"&&p.ready){const r=p.ready;
    if(Array.isArray(r.steps)&&r.steps.length)h+='<ol>'+r.steps.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>';
    if(r.prompt)h+='<pre>'+esc(r.prompt)+'</pre><div class="acts"><button class="btn pri sm" type="button" data-copy="'+esc(p.id)+'">Copy</button><button class="btn sm" type="button" data-done="'+esc(p.id)+'">Mark done</button></div>';
    else h+='<div class="acts">'+(safeUrl(r.url)?'<a class="btn pri sm" href="'+esc(r.url)+'" target="_blank" rel="noopener">Open</a>':'')+'<button class="btn sm" type="button" data-done="'+esc(p.id)+'">Mark done</button></div>';}
  return h+'</div>';
}
function card(c){
  const st=status(c),cls="card st-"+st+(S.sel.has(c.code)?" sel":"")+(S.focus===c.code?" focus":"");
  let h='<article class="'+cls+'" draggable="true" tabindex="0" data-code="'+esc(c.code)+'"><div class="meta"><span class="stp"><span class="dot d-'+st+'"></span>'+ST[st]+'</span>'+(c.kind?'<span>'+esc(c.kind)+'</span>':'')+(c.piId?'<span>'+esc(c.piId)+'</span>':'')+'<span>'+esc(rel(c.date))+'</span><label class="pk"><input type="checkbox" data-pick="'+esc(c.code)+'"'+(S.sel.has(c.code)?" checked":"")+' aria-label="Select '+esc(c.title)+'"></label></div><div class="ttl">'+esc(c.title)+'</div><p class="desc">'+esc(c.desc)+'</p>';
  if(c.topics.length||c.companies.length)h+='<div class="tags">'+c.topics.map(t=>'<button class="tag" type="button" data-topic="'+esc(t)+'">'+esc(t)+'</button>').join("")+c.companies.map(t=>'<button class="tag c" type="button" data-q="'+esc(t)+'">'+esc(t)+'</button>').join("")+'</div>';
  if(c.sug&&!c.keep&&!c.archived)h+='<span class="flag">Timeback Machine™ suggests archiving</span>';
  return h+'</article>';
}
function renderDrawer(list){
  const d=$("drawer"),f=S.focus&&list.find(c=>c.code===S.focus);
  if(!f){d.classList.remove("on");return}
  const st=status(f),tl=topicsList(list).map(x=>x[0]),relc=list.filter(c=>c.code!==f.code&&!c.archived&&c.topics.some(t=>f.topics.includes(t))).slice(0,8),u=cardUrl(f);
  d.innerHTML='<div class="dh"><div><div class="meta"><span class="stp"><span class="dot d-'+st+'"></span>'+ST[st]+'</span>'+(f.kind?'<span>'+esc(f.kind)+'</span>':'')+'<span>Updated '+esc(rel(f.date))+'</span></div><h2 id="dtitle">'+esc(f.title)+'</h2></div><button class="btn sm" type="button" id="dclose">Close</button></div>'+
   '<div class="db"><p style="margin:0">'+esc(f.desc)+'</p><div style="display:flex;gap:8px;flex-wrap:wrap">'+(u?'<a class="btn pri" href="'+esc(u)+'" target="_blank" rel="noopener">Open</a>':'')+'<button class="btn" type="button" data-arch="'+esc(f.code)+'">'+(f.archived?"Restore":"Archive")+'</button>'+(S.main.priorInventionsUrl&&!f.piId?'<button class="btn" type="button" data-pi="'+esc(f.code)+'">Add to Prior Inventions</button>':'')+'</div>'+
   (f.sug&&!f.keep?'<div><h4>Timeback Machine™ suggests archiving</h4><p style="margin:0;font-size:14px">'+esc(f.sug)+'</p></div>':'')+
   '<div><h4>Topics</h4><div class="tags" style="margin-bottom:8px">'+(f.topics.map(t=>'<button class="tag" type="button" data-untag="'+esc(t)+'" title="Remove from this topic">'+esc(t)+' ×</button>').join("")||'<span class="status">Unsorted</span>')+'</div><select data-addtopic="'+esc(f.code)+'" aria-label="Add to a topic"><option value="">Add to a topic...</option>'+tl.filter(t=>!f.topics.includes(t)).map(t=>'<option>'+esc(t)+'</option>').join("")+'<option value="__new">New topic...</option></select></div>'+
   '<div><h4>In the same topics</h4>'+(relc.length?'<ul>'+relc.map(x=>'<li><button type="button" data-focus="'+esc(x.code)+'">'+esc(x.title)+'</button></li>').join("")+'</ul>':'<p class="status">Nothing else yet.</p>')+'</div></div>';
  d.classList.add("on");
}
function renderBulk(list){
  for(const c of [...S.sel])if(!list.some(x=>x.code===c))S.sel.delete(c);
  const n=S.sel.size,b=$("bulk"),tl=topicsList(list).map(x=>x[0]);
  b.classList.toggle("on",n>0);
  b.innerHTML='<b>'+n+' selected</b>'+(S.view==="archive"?'<button class="btn pri sm" type="button" id="brest">Restore</button>':'<button class="btn pri sm" type="button" id="barch">Archive</button>')+
   '<select id="btopic" aria-label="Add selected to a topic"><option value="">Add to topic...</option>'+tl.map(t=>'<option>'+esc(t)+'</option>').join("")+'<option value="__new">New topic...</option></select><button class="btn sm" type="button" id="selall">Select all shown ('+list.filter(visible).length+')</button><button class="btn sm" type="button" id="bclear">Clear</button>';
}
function renderUpdate(){
  const u=S.upd||{},el=$("upd");
  if(u.applying&&u.applying!==APP_VERSION){el.innerHTML='<div class="banner"><span>Installing version '+esc(u.applying)+'. Reload this page when you get the notification.</span></div>';return}
  if(!u.version||!newer(u.version,APP_VERSION)||u.dismissed===u.version){el.innerHTML="";return}
  el.innerHTML='<div class="banner"><span><b>Version '+esc(u.version)+' is ready.</b> '+esc(u.notes||"")+'</span><span><button class="btn pri sm" type="button" id="updnow">Update now</button> <button class="btn sm" type="button" id="updlater">Not now</button></span></div>';
}
function newer(a,b){const x=String(a).split(".").map(Number),y=String(b).split(".").map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false}

function setStatus(t){$("status").textContent=t}
async function put(path,data){if(!S.db){setStatus("Sign in to save changes.");return false}try{await S.db.doc(path).set(data);setStatus("Saved");return true}catch(e){setStatus("Could not save. Try again.");return false}}
async function save(code,patch){const o=Object.assign({},S.over[code]||{},patch);S.over[code]=o;render();await put("state/"+code,o)}
async function saveMany(codes,fn){setStatus("Saving "+codes.length+" changes...");for(const c of codes)S.over[c]=fn(Object.assign({},S.over[c]||{}),c);render();for(const c of codes){if(!await put("state/"+c,S.over[c]))return}setStatus("Saved "+codes.length+" changes")}
function topicsOf(code){const c=all().find(x=>x.code===code);return c?c.topics.slice():[]}
async function fire(text){
  if(!S.mcp||!S.tasks.daily)return false;
  try{await S.mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:S.tasks.daily,text},{cache:false});return true}catch(e){return false}
}
async function decide(id,status){
  const p=Object.assign({},S.props[id]||{},{status,decidedAt:new Date().toISOString()});S.props[id]=p;render();
  if(!await put("proposals/"+id,p))return;
  if(status==="requested"){const ok=await fire("MODE: APPROVED\nPROPOSAL ID: "+id);setStatus(ok?"Claude is on it. You will get a notification when it is ready.":"Approved. Claude finishes it on the next daily run.")}
  if(status==="later")setStatus("Snoozed. It comes back only if it keeps coming up.");
  if(status==="never")setStatus("Got it. Timeback Machine™ will not suggest this again.");
}
async function ask(qs){
  const box=$("ask");box.className="ask on";
  if(!S.sample){box.textContent="Asking Claude is not available in this view. The search box still filters by words.";return}
  box.textContent="Asking Claude...";
  const cat=all().filter(c=>!c.archived).map(c=>c.code+" | "+c.title+" | "+c.topics.join(", ")+" | "+c.companies.join(", ")+" | "+c.date+" | "+c.desc).join("\n");
  const hubs=Object.values(S.hubs).map(h=>h.title+": "+h.url).join("\n");
  try{const r=await S.sample.json("You help the owner of this page find their own work. Catalog, one item per line: code | title | topics | companies | last updated | description.\n\n"+cat+"\n\nTopic hubs:\n"+hubs+"\n\nTheir question: "+qs+"\n\nReply with only JSON: {\"answer\": one or two plain sentences that answer them and name the best match, \"codes\": up to 8 codes from the catalog, best match first}.",{modelTier:"quick",cache:false});
    S.hits=(Array.isArray(r&&r.codes)?r.codes:[]).filter(x=>typeof x==="string");S.view="all";S.topic="";
    box.innerHTML="";const p=document.createElement("span");p.textContent=String(r&&r.answer||"No match found.");box.appendChild(p);
    const b=document.createElement("button");b.className="btn sm";b.type="button";b.textContent="Clear";b.onclick=()=>{S.hits=null;$("q").value="";S.q="";box.className="ask";render()};box.appendChild(b);render();
  }catch(e){box.textContent=e&&e.code==="not_granted"?"Claude was not allowed to answer here. The search box still filters by words.":"Claude could not answer just now. Try again in a minute."}
}
function newTopicFlow(sel,apply){
  const wrap=document.createElement("span");wrap.style.display="inline-flex";wrap.style.gap="6px";
  const inp=document.createElement("input");inp.placeholder="Topic name";inp.style.cssText="border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;min-height:36px;background:var(--bg);color:var(--ink);font-size:16px";
  const ok=document.createElement("button");ok.className="btn pri sm";ok.type="button";ok.textContent="Add";
  ok.onclick=()=>{const v=inp.value.trim().slice(0,60);if(v)apply(v)};inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();ok.click()}};
  wrap.append(inp,ok);sel.replaceWith(wrap);inp.focus();
}

$("q").addEventListener("input",e=>{S.q=e.target.value.trim();S.hits=null;$("ask").className="ask";if(S.q&&S.view==="home")S.view="all";render()});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.value.trim().split(/\s+/).length>2){e.preventDefault();ask(e.target.value.trim())}});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$("q").focus();return}
  if(e.key==="Escape"){if(S.focus){S.focus=null;render()}else if(S.sel.size){S.sel.clear();render()}return}
  const cd=e.target.closest&&e.target.closest(".card");if(cd&&e.target===cd&&(e.key==="Enter"||e.key===" ")){e.preventDefault();S.focus=cd.dataset.code;render()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  const pk=t.closest("[data-pick]");if(pk){pk.checked?S.sel.add(pk.dataset.pick):S.sel.delete(pk.dataset.pick);render();return}
  if(t.id==="btopic"&&t.value){const add=v=>{const codes=[...S.sel];S.sel.clear();saveMany(codes,(o,c)=>{const ts=topicsOf(c);if(!ts.includes(v))ts.push(v);o.topics=ts;return o})};if(t.value==="__new")newTopicFlow(t,add);else add(t.value);return}
  const at=t.closest("[data-addtopic]");if(at&&at.value){const code=at.dataset.addtopic,add=v=>{const ts=topicsOf(code);if(!ts.includes(v))ts.push(v);save(code,{topics:ts})};if(at.value==="__new")newTopicFlow(at,add);else add(at.value)}
});
document.addEventListener("click",async e=>{
  const t=e.target;
  const v=t.closest("[data-view]");if(v){S.view=v.dataset.view;S.topic="";S.focus=null;render();window.scrollTo({top:0});return}
  const tp=t.closest("[data-topic]");if(tp){S.topic=tp.dataset.topic;S.view="all";S.focus=null;render();window.scrollTo({top:0});return}
  const qq=t.closest("[data-q]");if(qq){$("q").value=qq.dataset.q;S.q=qq.dataset.q;S.view="all";S.topic="";render();return}
  const st=t.closest("[data-st]");if(st){const k=st.dataset.st;S.st.has(k)?S.st.delete(k):S.st.add(k);if(S.view==="home")S.view="all";render();return}
  const fc=t.closest("[data-focus]");if(fc){S.focus=fc.dataset.focus;render();return}
  const ar=t.closest("[data-arch]");if(ar){const c=all().find(x=>x.code===ar.dataset.arch);save(ar.dataset.arch,{archived:!(c&&c.archived)});return}
  const ut=t.closest("[data-untag]");if(ut&&S.focus){save(S.focus,{topics:topicsOf(S.focus).filter(x=>x!==ut.dataset.untag)});return}
  const y=t.closest("[data-yes]");if(y){decide(y.dataset.yes,"requested");return}
  const l=t.closest("[data-later]");if(l){decide(l.dataset.later,"later");return}
  const n=t.closest("[data-never]");if(n){decide(n.dataset.never,"never");return}
  const dn=t.closest("[data-done]");if(dn){decide(dn.dataset.done,"done");return}
  const cp=t.closest("[data-copy]");if(cp){const p=S.props[cp.dataset.copy];try{await navigator.clipboard.writeText(String(p&&p.ready&&p.ready.prompt||""));cp.textContent="Copied"}catch(err){cp.textContent="Select the text above and copy it"}return}
  const pi=t.closest("[data-pi]");if(pi){const c=all().find(x=>x.code===pi.dataset.pi);if(!c)return;const id="pi-"+c.code.toLowerCase().slice(0,30);
    const p={kind:"pi",title:c.title,why:"Added by you from your Topics Hub.",code:c.code,evidence:cardUrl(c)?[{label:"The work",url:cardUrl(c)}]:[],status:"requested",at:new Date().toISOString()};S.props[id]=p;render();if(await put("proposals/"+id,p)){const ok=await fire("MODE: APPROVED\nPROPOSAL ID: "+id);setStatus(ok?"Claude is drafting the Prior Inventions entry for your approval.":"Saved. Claude drafts the entry on the next daily run.")}return}
  if(t.id==="dclose"){S.focus=null;render();return}
  if(t.id==="selall"){all().filter(visible).forEach(c=>S.sel.add(c.code));render();return}
  if(t.id==="bclear"){S.sel.clear();render();return}
  if(t.id==="barch"||t.id==="brest"){const codes=[...S.sel],a=t.id==="barch";S.sel.clear();saveMany(codes,o=>{o.archived=a;return o});return}
  if(t.id==="updlater"){put("settings/update",Object.assign({},S.upd,{dismissed:S.upd.version}));return}
  if(t.id==="updnow"){t.disabled=true;const id="a-"+Date.now();await put("activity/"+id,{kind:"update",status:"running",startedAt:new Date().toISOString()});await put("settings/update",Object.assign({},S.upd,{applying:S.upd.version}));
    const ok=await fire("ACTIVITY ID: "+id+"\nMODE: APPLY UPDATE\nVERSION: "+S.upd.version);setStatus(ok?"Updating. You will get a notification when it is done.":"The update did not start. Try again in a minute.");return}
  if(t.closest("a,select,button,label,input,.drawer,.bulk"))return;
  const cd=t.closest(".card");if(cd){S.focus=S.focus===cd.dataset.code?null:cd.dataset.code;render();return}
  if(S.focus&&!t.closest(".card")){S.focus=null;render()}
});
document.addEventListener("dragstart",e=>{const cd=e.target.closest&&e.target.closest(".card");if(cd)e.dataTransfer.setData("text/plain",cd.dataset.code)});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("#tnav [data-topic],#archnav");if(z){e.preventDefault();z.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("#tnav [data-topic],#archnav");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("#tnav [data-topic],#archnav");if(!z)return;e.preventDefault();z.classList.remove("over");const code=e.dataTransfer.getData("text/plain");if(!code)return;
  if(z.id==="archnav")save(code,{archived:true});else{const ts=topicsOf(code);if(!ts.includes(z.dataset.topic)){ts.push(z.dataset.topic);save(code,{topics:ts})}}});

render();
(async()=>{
  const [d,s,m]=await Promise.all([claude.use("db"),claude.use("sample"),claude.use("mcp")]);
  S.sample=s;S.mcp=m;
  if(!d){S.loaded=true;setStatus("Sign in to see your topics.");render();return}
  S.db=d;
  const timer=setTimeout(()=>{if(!S.loaded)setStatus("Still loading. If nothing appears, reload the page.")},10000);
  let got=0;const ready=()=>{if(++got>=2&&!S.loaded){S.loaded=true;clearTimeout(timer);setStatus("Changes save automatically")}render()};
  const sub=(c,fn,counts)=>d.collection(c).onSnapshot(sn=>{const o={};sn.docs.forEach(x=>o[x.id]=x.data());fn(o);counts?ready():render()},()=>{});
  sub("cards",o=>S.cards=o,true);
  sub("settings",o=>{S.main=o.main||{};S.tasks=o.tasks||{};S.upd=o.update||{}},true);
  sub("state",o=>S.over=o);
  sub("hubs",o=>S.hubs=o);
  sub("proposals",o=>S.props=o);
  sub("meta",o=>S.sync=o.sync||{});
})();
}
</script>
</body>
</html>
